<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp cưới - Công Cường & Hà Hằng</title>

  <meta property="og:title" content="Thiệp cưới Công Cường 💍 Hà Hằng" />
  <meta property="og:description" content="Trân trọng mời bạn đến dự ngày vui của chúng tôi 💚" />
  <meta property="og:image" content="https://i.postimg.cc/cs7PrNh0/photo.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🌸 Intro mở cửa -->
  <div id="intro-screen">
    <div id="intro-left"></div>
    <div id="intro-right"></div>
    <div class="tap-text">💖 Chạm để mở 💖</div>
  </div>

  <!-- 💍 Nội dung chính -->
  <!-- data-event-time là chỗ duy nhất bạn cần chỉnh để thay đổi thời gian sự kiện -->
  <div class="main-content hidden" onclick="initMusic()">
    <div class="photo-frame">
      <img src="photo.jpg" alt="Ảnh cưới" class="wedding-photo" />
    </div>

    <h1 class="double-happiness">囍</h1>
    <p class="subtitle">LỄ THÀNH HÔN</p>
    <h2 class="name">Công Cường & Hà Hằng</h2>
    <p class="invite">Trân trọng mời <strong id="guestName">{{ guest_name }}</strong></p>

    <!-- Chú ý: chỉnh value của data-event-time ở đây nếu cần -->
    <div class="date" data-event-time="2025-11-30T10:00:00">
      <div class="time">
        <div class="big-time" id="eventTimeDisplay">10:00</div>
        <div class="small-time">GIỜ</div>
      </div>
      <div class="weekday small" id="weekdayLabel">CHỦ NHẬT</div>

      <!-- ngày lớn -->
      <div class="big" id="dayNumber">30</div>

      <!-- phần chứa tháng + năm -->
      <div class="small" id="monthYear">THÁNG 11<br>NĂM 2025</div>

      <!-- giờ bên cạnh ngày -->
      <div class="time">
        <div class="big-time" id="eventTimeDisplay">10:00</div>
        <div class="small-time">GIỜ</div>
      </div>
    </div>

    <div class="countdown" id="countdown"></div>

    <p class="address">
      📍 Địa chỉ nhà trai:<br>
      Số 96 Đường Thôn 6, Bắc Sơn, An Dương, Hải Phòng
    </p>

    <div class="buttons">
      <button onclick="submitChoice('Tham gia')">👍 Nhất định sẽ đến<br>📍 Mở bản đồ</button>
      <button onclick="submitChoice('Bận - Mừng online')">😭 Tiếc quá, mình bận rồi<br>💌 Mừng cưới online vậy</button>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
